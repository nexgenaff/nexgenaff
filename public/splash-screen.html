<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afficixo Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071014 0%, #0a1628 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
        }

        .splash-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Animated background grid */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(52, 211, 153, 0.05) 25%, rgba(52, 211, 153, 0.05) 26%, transparent 27%, transparent 74%, rgba(52, 211, 153, 0.05) 75%, rgba(52, 211, 153, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(52, 211, 153, 0.05) 25%, rgba(52, 211, 153, 0.05) 26%, transparent 27%, transparent 74%, rgba(52, 211, 153, 0.05) 75%, rgba(52, 211, 153, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Logo container */
        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: logoFadeIn 0.8s ease-out;
            z-index: 10;
        }

        .logo-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(52, 211, 153, 0.2), rgba(52, 211, 153, 0.05));
            border: 2px solid rgba(52, 211, 153, 0.3);
            animation: rotateLogo 3s linear infinite;
            z-index: 10;
        }

        .logo-image {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            object-fit: contain;
            object-position: center;
            filter: drop-shadow(0 0 30px rgba(52, 211, 153, 0.4));
            z-index: 15;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes rotateLogo {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Brand name */
        .brand-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 15px;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
            z-index: 10;
            position: relative;
            background: linear-gradient(135deg, #34d399 0%, #22D3EE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Tagline */
        .tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.3s backwards;
            z-index: 10;
            position: relative;
        }

        /* Loading indicator */
        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 10;
            position: relative;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #34d399;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            40% {
                transform: translateY(-12px);
                opacity: 1;
            }
        }

        /* Fade in up animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glow effect */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .brand-name {
                font-size: 24px;
            }
            .logo-inner {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <div class="glow"></div>

    <div class="splash-container">
        <div class="logo-container">
            <div class="logo-circle"></div>
            <img src="/web-app-manifest-192x192.png" alt="Afficixo" class="logo-image" />
        </div>

        <div class="brand-name">AFFICIXO</div>
        <div class="tagline">Premium CPC Affiliate Network</div>

        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Redirect to main app after a short delay (for demonstration)
        // In production, this happens automatically as the app loads
        setTimeout(() => {
            // The actual app will load before this timeout
            // This ensures users never see a blank screen
        }, 2000);
    </script>
</body>
</html>
